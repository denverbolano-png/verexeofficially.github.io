<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Habit Game - Annual Habit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--hd:#0c3a30;--g:#0c3a30;--g3:#327e58;--bg:#f5f6f5;--card:#fff;--tx:#14201c;--mu:#66746f;--ln:#e3e8e5;--bad:#d9534f;--sh:0 6px 24px rgba(12,58,48,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3fa06f;--bg:#0d1512;--card:#14201b;--tx:#e6eeea;--mu:#8fa39b;--ln:#243630;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--g:#379b69;--bg:#0d1512;--card:#14201b;--tx:#e6eeea;--mu:#8fa39b;--ln:#243630}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--g3);outline-offset:2px}
.btn{background:var(--g);color:#fff;border-radius:999px;padding:12px 24px;font-weight:700;transition:transform .15s,box-shadow .15s;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(12,58,48,.25)}.btn.out{background:transparent;color:var(--tx);border:2px solid var(--tx)}.btn.sm{padding:8px 16px;min-height:38px;font-size:.85rem}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:20px}.wrap{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:24px;padding:10px 24px;flex-wrap:wrap}
.logo{font-weight:800;line-height:.9;font-size:1.25rem;color:var(--g);letter-spacing:-.5px}.logo small{display:block;font-size:.6rem;letter-spacing:0}
.links{display:flex;gap:6px;margin-left:auto;align-items:center}.links a{padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--mu)}.links a:hover,.links a.on{background:var(--bg);color:var(--tx)}
.burger{display:none;margin-left:auto;font-size:1.6rem;min-width:44px;min-height:44px}
@media(max-width:820px){.burger{display:block}.links{display:none;width:100%;flex-direction:column;align-items:stretch;margin:0}.top.open .links{display:flex}.links a,.links .btn{text-align:center;justify-content:center}}
.hero{max-width:1200px;margin:0 auto;padding:48px 20px;display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding-top:28px}}
h1{font-size:clamp(2.6rem,7vw,4.6rem);line-height:1;margin:0 0 16px;font-weight:800;color:var(--g);letter-spacing:-1.5px}h2{margin:0 0 12px;font-size:1.15rem}
.sub{color:var(--mu);font-size:1.1rem;margin:0 0 24px}.cta{display:flex;gap:12px;flex-wrap:wrap}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.pill{background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.82rem}
.lap{filter:drop-shadow(0 20px 30px rgba(12,58,48,.25))}.scr{background:#fff;border:8px solid #222;border-radius:14px 14px 0 0;padding:8px;color:#14201c}
.mh{background:var(--hd);color:#fff;font-size:.6rem;padding:5px 8px;border-radius:4px;margin-bottom:6px}.mb{display:flex;gap:8px;align-items:flex-end;margin-bottom:6px}
.mbars{flex:1;height:70px;display:flex;align-items:flex-end;gap:2px}.mbars i{flex:1;background:var(--hd);border-radius:1px}.mdn{width:70px}.mg{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.mg u{aspect-ratio:1;border:1px solid #cfd8d4;border-radius:2px}.mg u.on{background:var(--hd);border-color:var(--hd)}.base{height:12px;background:linear-gradient(#ccc,#999);border-radius:0 0 14px 14px;margin:0 -4%}
.feat{max-width:1200px;margin:0 auto;padding:30px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.ico{width:48px;height:48px;border-radius:50%;background:var(--hd);color:#fff;display:grid;place-items:center;font-size:1.3rem;margin-bottom:12px}
.band{background:var(--hd);color:#fff;padding:56px 20px;text-align:center}.band p{max-width:640px;margin:0 auto 24px;line-height:1.7;opacity:.9}.band .btn{background:#fff;color:var(--hd)}
footer{text-align:center;padding:20px;color:var(--mu);font-size:.8rem;letter-spacing:2px}
.welcome{background:var(--hd);color:#fff;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}.welcome h2{font-size:1.6rem;margin:0}.welcome p{margin:4px 0 0;opacity:.8}.welcome .btn{background:#fff;color:var(--hd)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.stat b{display:block;font-size:2rem;font-weight:800;color:var(--g)}.stat span{color:var(--mu);font-size:.82rem;font-weight:600}
.months{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;align-items:center}.months button{padding:9px 16px;border-radius:999px;background:var(--card);font-weight:600;white-space:nowrap;box-shadow:var(--sh);min-height:40px}
.months button.on{background:var(--hd);color:#fff}.months button.now:not(.on){border:2px solid var(--g3)}.yr{font-weight:800;min-width:56px;text-align:center}
.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input,.tools select,.fm input,.fm select{border:1.5px solid var(--ln);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;width:100%}.tools input{flex:1;min-width:180px;width:auto}.tools select{width:auto}
.gw{overflow-x:auto;border-radius:14px;border:1px solid var(--ln);-webkit-overflow-scrolling:touch}table{border-collapse:separate;border-spacing:0;width:100%;font-size:.75rem}
th,td{padding:3px;text-align:center;background:var(--card)}thead th{background:var(--hd);color:#fff;font-weight:600;padding:5px 2px;min-width:30px}thead th.wk{border-left:2px solid var(--card)}thead th.tdy{background:var(--g3)}
.sc{position:sticky;left:0;z-index:2;text-align:left;min-width:210px;max-width:230px;padding:6px 10px;background:var(--card);border-right:1px solid var(--ln)}thead .sc{background:var(--hd);z-index:3}
.hn{display:flex;gap:6px;align-items:center;justify-content:space-between}.hn b{display:block;font-size:.8rem}.hn small{color:var(--mu);font-weight:500}.ac{display:flex;gap:2px;align-items:center}.ac button{min-width:28px;min-height:28px;border-radius:8px;color:var(--mu)}.ac button:hover{background:var(--bg)}
.sw{width:30px!important;height:16px!important;min-height:16px!important;border-radius:99px!important;background:var(--ln);position:relative}.sw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--g3)}.sw.on:after{left:16px}
tr.off td,tr.off .hn>div{opacity:.4}
.c{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--ln);color:#fff;font-weight:800;transition:transform .12s,background .12s;font-size:.8rem}.c:hover:not(:disabled){transform:scale(1.15)}
.c.done{background:var(--g3);border-color:var(--g3)}.c.miss{background:rgba(217,83,79,.1);border-color:rgba(217,83,79,.35);color:var(--bad)}.c.tdy{border:2px solid var(--g3)}.c.fut{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}.ch{width:100%;height:auto}.gl{stroke:var(--ln)}.ax{font-size:10px;fill:var(--mu);font-family:inherit}.bar{fill:var(--g)}.bar.hi{fill:var(--g3)}.dn{font-size:24px;font-weight:800;fill:var(--g);font-family:inherit}
.dnw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.dnw svg{width:140px;height:140px}.kv{display:grid;gap:6px;font-weight:600}.kv span{color:var(--mu);font-weight:500}
.ar{display:grid;grid-template-columns:1fr 40px 40px 40px;gap:8px;align-items:center;font-size:.8rem;padding:6px 0;border-bottom:1px solid var(--ln)}.ar .pb{grid-column:1/-1;height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g3);border-radius:9px}.ar.h{color:var(--mu);font-weight:600}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-weight:600}.rank i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--hd);color:#fff;display:grid;place-items:center;font-size:.8rem}.rank small{color:var(--mu);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips button{padding:6px 14px;border-radius:99px;border:1.5px solid var(--ln);font-weight:600;font-size:.8rem}.chips button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.avg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;text-align:center;font-size:.75rem;color:var(--mu)}.avg b{display:block;color:var(--g);font-size:1rem}
.fm{display:grid;gap:12px}.fm label{display:grid;gap:6px;font-weight:600;font-size:.85rem}.fm .chk{display:flex;align-items:center;gap:8px}.fm .chk input{width:auto;min-height:0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.err{color:var(--bad);font-size:.85rem;font-weight:600;margin:0;min-height:1em}.empty{text-align:center;padding:36px 12px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:1.05rem;margin-bottom:6px}
#modal{position:fixed;inset:0;background:rgba(5,20,15,.55);display:none;place-items:center;z-index:50;padding:16px}#modal.show{display:grid}.mc{background:var(--card);border-radius:22px;padding:26px;width:min(440px,100%);max-height:90vh;overflow:auto;animation:pop .2s}.mc h2{font-size:1.4rem}
@keyframes pop{from{transform:translateY(12px);opacity:0}}.lk{color:var(--g);font-weight:700;text-decoration:underline;font-size:.85rem}.lks{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,80px);background:var(--hd);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .25s;z-index:60;max-width:90vw}#toast.show{transform:translate(-50%,0)}#toast.err{background:var(--bad)}
.sk{background:linear-gradient(90deg,var(--ln),var(--card),var(--ln));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:20px}@keyframes sh{to{background-position:-200% 0}}
#app{animation:fi .3s}@keyframes fi{from{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="nav"></div><main id="app"></main><div id="modal"></div><div id="toast" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),MON=['January','February','March','April','May','June','July','August','September','October','November','December'],CATS=['Health','Fitness','Mind','Work','Lifestyle'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={},store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Browser storage is blocked, so changes will not persist after refresh.','err')}},del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const T=new Date(),p2=n=>String(n).padStart(2,'0'),kk=(y,m,d)=>`${y}-${p2(m+1)}-${p2(d)}`,key=d=>kk(d.getFullYear(),d.getMonth(),d.getDate()),tk=key(T),dim=(y,m)=>new Date(y,m+1,0).getDate();
const S={user:null,data:null,year:T.getFullYear(),month:T.getMonth(),q:'',cat:'all',view:'home',sec:'',auth:'login',wm:'mood',wdate:tk,loading:false,edit:null};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SAMPLE=[['Wake up at 5:00 AM','Lifestyle',7,'05:00'],['Gym','Fitness',5,'06:00'],['Reading / Learning','Mind',7,'21:00'],['Daily Planning','Work',7,'07:00'],['Project Work','Work',5,'09:00'],['No Alcohol','Health',7,''],['Social Media Detox','Mind',7,''],['Goal Journaling','Mind',7,'22:00'],['Cold Shower','Health',6,'05:30'],['Meditation','Mind',7,'06:30'],['Stretching','Fitness',7,'06:15']];
function seed(){const r=rng(42),habits=SAMPLE.map((h,i)=>({id:'h'+i,name:h[0],cat:h[1],freq:h[2],time:h[3],on:true})),log={},well={};
for(let d=new Date(T.getFullYear(),0,1);key(d)<tk;d.setDate(d.getDate()+1)){const k=key(d),f=.7+.3*r();log[k]=habits.filter((h,i)=>r()<Math.min(.97,(.6+(i*37%10)/30)*f+.1)).map(h=>h.id);
well[k]={mood:2+Math.round(r()*3),sleep:5+Math.round(r()*7)/2,energy:1+Math.round(r()*4),water:3+Math.round(r()*7),ex:Math.round(r()*6)*10}}
return{habits,log,well}}
/* ---------- stats ---------- */
const act=()=>S.data.habits.filter(h=>h.on),isD=(id,k)=>(S.data.log[k]||[]).includes(id),sum=(a,f)=>a.reduce((s,x)=>s+x[f],0);
const elap=(y,m)=>y<T.getFullYear()||(y==T.getFullYear()&&m<T.getMonth())?dim(y,m):(y==T.getFullYear()&&m==T.getMonth()?T.getDate():0);
function hstat(h,y,m){const e=elap(y,m);let dn=0;for(let d=1;d<=e;d++)if(isD(h.id,kk(y,m,d)))dn++;const goal=Math.ceil(e*h.freq/7);return{h,dn,goal,left:Math.max(0,goal-dn),rate:goal?Math.min(1,dn/goal):0}}
function mstat(y,m){const hs=act().map(h=>hstat(h,y,m)),goal=sum(hs,'goal'),dn=sum(hs,'dn');return{hs,goal,dn,left:Math.max(0,goal-dn),pct:goal?Math.min(100,Math.round(dn/goal*100)):0,missed:Math.max(0,hs.length*elap(y,m)-dn)}}
function dayPct(k){const a=act();return a.length?a.filter(h=>isD(h.id,k)).length/a.length*100:0}
function streaks(){let run=0,best=0;for(const d=new Date(T.getFullYear()-1,0,1);key(d)<=tk;d.setDate(d.getDate()+1)){const k=key(d);if(dayPct(k)>=50){run++;best=Math.max(best,run)}else if(k!==tk)run=0}return{cur:run,best}}
function hstreak(id){const d=new Date(T);if(!isD(id,key(d)))d.setDate(d.getDate()-1);let n=0;while(isD(id,key(d))&&n<800){n++;d.setDate(d.getDate()-1)}return n}
function weeks(y,m){const w=[];let c=null;for(let d=1;d<=dim(y,m);d++){const dow=(new Date(y,m,d).getDay()+6)%7;if(!c||!dow){c={n:w.length+1,days:[]};w.push(c)}c.days.push([d,dow])}return w}
/* ---------- charts ---------- */
function axes(W,H,pl,pb,mx,u){let s='';[0,50,100].forEach(g=>{const y=H-pb-(H-pb-8)*g/100;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="0" y="${y+4}" class="ax">${Math.round(mx*g/100*10)/10}${u}</text>`});return s}
function bars(v,l,o={}){const W=600,H=170,pl=34,pb=22,n=v.length,bw=(W-pl)/n,mx=o.max||100,u=o.u===undefined?'%':o.u;let s=`<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="${o.t}">`+axes(W,H,pl,pb,mx,u);
v.forEach((x,i)=>{const h=(H-pb-8)*Math.min(x,mx)/mx;s+=`<rect x="${pl+i*bw+bw*.15}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="${Math.min(3,bw*.35)}" class="bar${o.hi===i?' hi':''}"><title>${l[i]}: ${x}${u}</title></rect>`;if(n<=14||i%Math.ceil(n/15)==0)s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" class="ax" text-anchor="middle">${l[i]}</text>`});return s+'</svg>'}
function lines(v,l,mx,u,t){const W=600,H=170,pl=34,pb=22,n=l.length,st=(W-pl-8)/Math.max(1,n-1),pts=v.map((x,i)=>x==null?null:[pl+i*st,H-pb-(H-pb-8)*Math.min(x,mx)/mx,x]).filter(Boolean);let s=`<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="${t}">`+axes(W,H,pl,pb,mx,u);
if(pts.length)s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--g3)" stroke-width="2.5" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--g)"><title>${p[2]}${u}</title></circle>`).join('');
l.forEach((x,i)=>{if(n<=14||i%Math.ceil(n/15)==0)s+=`<text x="${pl+i*st}" y="${H-6}" class="ax" text-anchor="middle">${x}</text>`});return s+'</svg>'}
function donut(p,sz){const c=2*Math.PI*52;return`<svg viewBox="0 0 140 140" ${sz?`width="${sz}" height="${sz}"`:''} role="img" aria-label="${p}% complete"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--ln)" stroke-width="16"/><circle cx="70" cy="70" r="52" fill="none" stroke="var(--g3)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" class="dn">${p}%</text></svg>`}
/* ---------- ui helpers ---------- */
let tt;function toast(m,t){const e=$('#toast');e.textContent=m;e.className='show'+(t?' err':'');clearTimeout(tt);tt=setTimeout(()=>e.className='',3200)}
function openModal(h){const m=$('#modal');m.innerHTML=`<div class="mc" role="dialog" aria-modal="true">${h}</div>`;m.classList.add('show');const f=m.querySelector('input:not([type=hidden])');f&&f.focus()}
const closeModal=()=>{$('#modal').classList.remove('show');$('#modal').innerHTML=''};
const save=()=>S.user&&store.set('hg_data_'+S.user.email,S.data);
/* ---------- views ---------- */
function navHTML(){const v=S.view,h=S.sec;return`<header class="top"><a href="#home" data-nav="home" class="logo">♛ HABIT<br>GAME<small>Plan Better • Build Habits • Achieve More</small></a><button class="burger" data-act="menu" aria-label="Open menu">☰</button><nav class="links"><a href="#home" data-nav="home" class="${v=='home'&&h!='features'&&h!='about'?'on':''}">Home</a><a href="#features" data-nav="features" class="${h=='features'?'on':''}">Features</a><a href="#dash" data-nav="dash" class="${v=='dash'?'on':''}">Dashboard</a><a href="#about" data-nav="about" class="${h=='about'?'on':''}">About</a>${S.user?`<a href="#dash" data-nav="dash">Hi, ${esc(S.user.name.split(' ')[0])}</a><button class="btn sm out" data-act="logout">Log out</button>`:`<button class="btn sm" data-act="auth" data-m="signup">Login / Get Started</button>`}</nav></header>`}
function mock(){const r=rng(7);let b='',g='';for(let i=0;i<30;i++)b+=`<i style="height:${30+r()*70}%"></i>`;for(let i=0;i<330;i++)g+=`<u class="${r()<.72?'on':''}"></u>`;return`<div class="lap" aria-hidden="true"><div class="scr"><div class="mh"><b>HABIT TRACKER • Sample preview</b></div><div class="mb"><div class="mbars">${b}</div><div class="mdn">${donut(74,70)}</div></div><div class="mg">${g}</div></div><div class="base"></div></div>`}
function home(){const F=[['▦','12-Month Tracking','Switch between January and December and see every month of your year.'],['✓','Daily Habit Tracking','Tap a day to check a habit off. Streaks and percentages update instantly.'],['☾','Sleep & Wellness Tracking','Log mood, sleep, energy, water and exercise and watch the trends.'],['▮','Progress Dashboard','Charts, top habits and totals calculated from your own data.']];
return`<section class="hero"><div><h1>ANNUAL<br>HABIT TRACKER</h1><p class="sub">Track your habits. Build consistency. Achieve more.</p><div class="cta"><button class="btn" data-act="start">Start Tracking</button><button class="btn out" data-act="viewdash">View Dashboard</button></div><div class="pills"><span class="pill">12-Month Tracking</span><span class="pill">Daily Habit Tracking</span><span class="pill">Sleep & Wellness</span><span class="pill">Progress Dashboard</span></div></div>${mock()}</section>
<section class="feat" id="features">${F.map(f=>`<div class="card"><div class="ico">${f[0]}</div><h2>${f[1]}</h2><p style="color:var(--mu);margin:0;line-height:1.6">${f[2]}</p></div>`).join('')}</section>
<section class="band" id="about"><h2 style="font-size:1.8rem">Turn your year into a game</h2><p>Habit Game is a minimalist habit tracker. Create your habits, check them off each day, and let the dashboard show how consistent you really are. Your data is saved in this browser, so it is still here when you come back.</p><button class="btn" data-act="start">Create a free account</button></section><footer>PLAN BETTER • BUILD HABITS • ACHIEVE MORE</footer>`}
function filt(){const q=S.q.trim().toLowerCase();return S.data.habits.filter(h=>(!q||h.name.toLowerCase().includes(q))&&(S.cat=='all'||h.cat==S.cat))}
function grid(){const y=S.year,m=S.month,hs=filt(),W=weeks(y,m),days=W.flatMap(w=>w.days),isT=d=>kk(y,m,d)===tk;
if(!S.data.habits.length)return`<div class="empty"><b>No habits yet</b>Add your first habit to start tracking.<br><br><button class="btn" data-act="add">Add a habit</button> <button class="btn out" data-act="sample">Load sample data</button></div>`;
if(!hs.length)return`<div class="empty"><b>No habits match your filter</b>Try a different search or category.</div>`;
return`<div class="gw"><table><thead><tr><th class="sc" rowspan="3">My habits</th>${W.map(w=>`<th colspan="${w.days.length}" class="wk">Week ${w.n}</th>`).join('')}</tr><tr>${days.map(([d,w])=>`<th class="${isT(d)?'tdy':''}">${'MTWTFSS'[w]}</th>`).join('')}</tr><tr>${days.map(([d])=>`<th class="${isT(d)?'tdy':''}">${d}</th>`).join('')}</tr></thead><tbody>${hs.map(h=>`<tr class="${h.on?'':'off'}"><th class="sc"><div class="hn"><div><b>${esc(h.name)}</b><small>${h.cat} • ${h.freq}×/wk${h.time?' • '+h.time:''}</small></div><span class="ac"><button class="sw${h.on?' on':''}" data-act="en" data-id="${h.id}" aria-pressed="${h.on}" aria-label="${h.on?'Disable':'Enable'} ${esc(h.name)}"></button><button data-act="ed" data-id="${h.id}" aria-label="Edit ${esc(h.name)}">✎</button><button data-act="rm" data-id="${h.id}" aria-label="Delete ${esc(h.name)}">✕</button></span></div></th>${days.map(([d])=>{const k=kk(y,m,d),dn=isD(h.id,k),fu=k>tk;return`<td><button class="c ${dn?'done':fu?'fut':k===tk?'tdy':'miss'}" data-act="tog" data-id="${h.id}" data-k="${k}" ${fu||!h.on?'disabled':''} aria-label="${esc(h.name)} on ${k}: ${dn?'done':'not done'}">${dn?'✓':fu||k===tk?'':'×'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
const WM={mood:['Mood',5,''],sleep:['Sleep',10,'h'],energy:['Energy',5,''],water:['Water',12,' gl'],ex:['Exercise',90,' min']};
function dash(){if(S.loading)return`<div class="wrap"><div class="sk" style="height:130px"></div><div class="sk" style="height:100px"></div><div class="sk" style="height:340px"></div></div>`;
const y=S.year,m=S.month,ms=mstat(y,m),st=streaks(),A=act(),td=A.filter(h=>isD(h.id,tk)).length,e=elap(y,m),n=dim(y,m),cur=y==T.getFullYear()&&m==T.getMonth();
const dv=[],dl=[];for(let d=1;d<=n;d++){dv.push(d<=e?Math.round(dayPct(kk(y,m,d))):0);dl.push(d)}
const wv=weeks(y,m).map(w=>{const ds=w.days.filter(([d])=>d<=e);return ds.length?Math.round(ds.reduce((s,[d])=>s+dayPct(kk(y,m,d)),0)/ds.length):0});
const yv=MON.map((_,i)=>elap(y,i)?mstat(y,i).pct:null),yd=MON.reduce((s,_,i)=>s+mstat(y,i).dn,0),ranked=[...ms.hs].sort((a,b)=>b.rate-a.rate||b.dn-a.dn).slice(0,5);
const wl=S.data.well,ent=Array.from({length:n},(_,i)=>wl[kk(y,m,i+1)]),wv2=ent.map(x=>x?x[S.wm]:null),cur_w=wl[S.wdate]||{mood:3,sleep:7,energy:3,water:6,ex:30};
const avg=k=>{const a=ent.filter(Boolean).map(x=>x[k]);return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10:'-'};
return`<div class="wrap"><div class="card welcome"><div><h2>Welcome back, ${esc(S.user.name.split(' ')[0])}</h2><p>${T.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})} • Viewing ${MON[m]} ${y}</p></div><button class="btn" data-act="add">+ Add habit</button></div>
<div class="stats"><div class="card stat"><b>${ms.pct}%</b><span>${MON[m]} completion</span></div><div class="card stat"><b>${S.data.habits.length}</b><span>Total habits (${A.length} active)</span></div><div class="card stat"><b>${td}</b><span>Completed today</span></div><div class="card stat"><b>${A.length-td}</b><span>Remaining today</span></div><div class="card stat"><b>${st.cur}</b><span>Day streak</span></div></div>
<div class="months"><button data-act="yr" data-d="-1" aria-label="Previous year">‹</button><span class="yr">${y}</span><button data-act="yr" data-d="1" aria-label="Next year">›</button>${MON.map((x,i)=>`<button data-act="mo" data-m="${i}" class="${i==m?'on':''}${y==T.getFullYear()&&i==T.getMonth()?' now':''}">${x}</button>`).join('')}</div>
<div class="card"><h2>${MON[m]} habit calendar</h2><div class="tools" style="margin-bottom:12px"><input id="q" data-bind="q" type="search" placeholder="Search habits" value="${esc(S.q)}" aria-label="Search habits"><select id="cat" data-bind="cat" aria-label="Filter by category"><option value="all">All categories</option>${CATS.map(c=>`<option${S.cat==c?' selected':''}>${c}</option>`).join('')}</select></div>${grid()}<p style="color:var(--mu);font-size:.8rem;margin:10px 0 0">Tap a day to mark a habit done. A day counts toward your streak when at least half of your active habits are done.</p></div>
<div class="grid2"><div class="card"><h2>Daily progress</h2>${bars(dv,dl,{t:'Daily progress',hi:cur?T.getDate()-1:-1})}</div><div class="card"><h2>Weekly progress</h2>${bars(wv,wv.map((_,i)=>'Week '+(i+1)),{t:'Weekly progress'})}</div>
<div class="card"><h2>Monthly completion rate</h2><div class="dnw">${donut(ms.pct)}<div class="kv"><div><span>Goal</span> ${ms.goal}</div><div><span>Completed</span> ${ms.dn}</div><div><span>Left</span> ${ms.left}</div></div></div></div>
<div class="card"><h2>Streaks & totals</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><b>${st.cur}</b><span>Current streak</span></div><div class="stat"><b>${st.best}</b><span>Longest streak</span></div><div class="stat"><b>${ms.dn}</b><span>Total completed</span></div><div class="stat"><b>${ms.missed}</b><span>Total missed</span></div></div></div></div>
<div class="grid2"><div class="card"><h2>Habit completion</h2><div class="ar h"><span>Habit</span><span>Goal</span><span>Done</span><span>Left</span></div>${ms.hs.length?ms.hs.map(s=>`<div class="ar"><span>${esc(s.h.name)}</span><span>${s.goal}</span><span>${s.dn}</span><span>${s.left}</span><div class="pb" title="${Math.round(s.rate*100)}%"><i style="width:${s.rate*100}%"></i></div></div>`).join(''):'<div class="empty">Enable a habit to see its progress.</div>'}</div>
<div class="card"><h2>Top habits</h2>${e&&ranked.length?ranked.map((s,i)=>`<div class="rank"><i>${i+1}</i><span>${esc(s.h.name)}<br><small>${hstreak(s.h.id)}-day streak</small></span><b>${Math.round(s.rate*100)}%</b></div>`).join(''):'<div class="empty"><b>Nothing to rank yet</b>Complete some habits this month and your top five will appear here.</div>'}</div></div>
<div class="grid2"><div class="card"><h2>Log wellness</h2><form class="fm" data-form="well" novalidate><label>Date<input type="date" data-bind="wdate" name="date" value="${S.wdate}" max="${tk}"></label><div class="row2"><label>Mood (1-5)<select name="mood">${[1,2,3,4,5].map(i=>`<option value="${i}"${cur_w.mood==i?' selected':''}>${i} ${['Low','Down','Okay','Good','Great'][i-1]}</option>`).join('')}</select></label><label>Energy (1-5)<select name="energy">${[1,2,3,4,5].map(i=>`<option${cur_w.energy==i?' selected':''}>${i}</option>`).join('')}</select></label></div><div class="row2"><label>Sleep (hours)<input name="sleep" type="number" step="0.5" min="0" max="24" value="${cur_w.sleep}"></label><label>Water (glasses)<input name="water" type="number" min="0" max="30" value="${cur_w.water}"></label></div><label>Exercise (minutes)<input name="ex" type="number" min="0" max="600" value="${cur_w.ex}"></label><p class="err" role="alert"></p><button class="btn">Save wellness</button></form></div>
<div class="card"><h2>Wellness trends</h2><div class="chips">${Object.keys(WM).map(k=>`<button data-act="wm" data-k="${k}" class="${S.wm==k?'on':''}">${WM[k][0]}</button>`).join('')}</div>${ent.some(Boolean)?lines(wv2,dl,WM[S.wm][1],WM[S.wm][2],WM[S.wm][0]+' trend'):'<div class="empty"><b>No wellness data this month</b>Log how you feel to see a chart.</div>'}<div class="avg">${Object.keys(WM).map(k=>`<div><b>${avg(k)}</b>${WM[k][0]}</div>`).join('')}</div></div></div>
<div class="card"><h2>${y} year overview <span style="color:var(--mu);font-weight:500;font-size:.85rem">• ${yd} habits completed this year</span></h2>${lines(yv,MON.map(x=>x.slice(0,3)),100,'%','Monthly completion for '+y)}</div></div>`}
function authHTML(){const m=S.auth,t={login:'Welcome back',signup:'Create your account',forgot:'Reset your password'}[m];
return`<h2>${t}</h2><form class="fm" data-form="${m}" novalidate>${m=='signup'?'<label>Name<input name="name" autocomplete="name" maxlength="40"></label>':''}<label>Email<input name="email" type="email" autocomplete="email"></label><label>${m=='forgot'?'New password':'Password'}<input name="pw" type="password" autocomplete="${m=='login'?'current-password':'new-password'}"></label>${m!='login'?'<label>Confirm password<input name="pw2" type="password" autocomplete="new-password"></label>':''}<p class="err" role="alert"></p><button class="btn" style="justify-content:center">${{login:'Log in',signup:'Sign up',forgot:'Reset password'}[m]}</button>${m=='forgot'?'<p style="font-size:.78rem;color:var(--mu);margin:0">There is no email server, so the reset happens on this device for accounts created here.</p>':''}<div class="lks">${m=='login'?'<button type="button" class="lk" data-act="auth" data-m="forgot">Forgot password?</button><button type="button" class="lk" data-act="auth" data-m="signup">Create account</button>':'<button type="button" class="lk" data-act="auth" data-m="login">Back to login</button>'}</div><button type="button" class="btn out sm" data-act="demo" style="justify-content:center">Try the demo account</button></form>`}
function habitForm(h){h=h||{name:'',cat:'Health',freq:7,time:'',on:true};return`<h2>${h.id?'Edit habit':'Add a habit'}</h2><form class="fm" data-form="habit" novalidate><input type="hidden" name="id" value="${h.id||''}"><label>Habit name<input name="name" maxlength="40" value="${esc(h.name)}" placeholder="e.g. Drink 2L of water"></label><div class="row2"><label>Category<select name="cat">${CATS.map(c=>`<option${c==h.cat?' selected':''}>${c}</option>`).join('')}</select></label><label>Target<select name="freq">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}"${n==h.freq?' selected':''}>${n==7?'Every day':n+'× a week'}</option>`).join('')}</select></label></div><label>Preferred time (optional)<input type="time" name="time" value="${h.time||''}"></label><label class="chk"><input type="checkbox" name="on"${h.on?' checked':''}> Track this habit</label><p class="err" role="alert"></p><div class="acts"><button type="button" class="btn out" data-act="close">Cancel</button><button class="btn">Save habit</button></div></form>`}
function render(){const ae=document.activeElement,id=ae&&ae.id,ss=ae&&ae.selectionStart,gw=$('.gw'),sl=gw?gw.scrollLeft:0;$('#nav').innerHTML=navHTML();$('#app').innerHTML=S.view=='dash'&&S.user?dash():home();const g=$('.gw');if(g)g.scrollLeft=sl;if(id&&$('#'+id)){const el=$('#'+id);el.focus();try{el.setSelectionRange(ss,ss)}catch(x){}}}
/* ---------- auth ---------- */
async function hash(e,p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(x){return btoa(unescape(encodeURIComponent(e+p)))}}
function loadUser(email,name){let d=store.get('hg_data_'+email,null);if(!d||!Array.isArray(d.habits)||!d.log||!d.well){if(d)toast('Saved data was damaged, so sample data was restored.','err');d=seed();store.set('hg_data_'+email,d)}S.user={email,name};S.data=d;store.set('hg_session',email);S.loading=true;S.q='';S.cat='all';S.year=T.getFullYear();S.month=T.getMonth();closeModal();go('dash');setTimeout(()=>{S.loading=false;render()},500)}
function nav(h){if(h=='dash'&&!S.user){S.view='home';S.sec='';render();S.auth='login';openModal(authHTML());return}S.view=h=='dash'?'dash':'home';S.sec=h=='features'||h=='about'?h:'';render();if(S.sec){const el=$('#'+S.sec);el&&el.scrollIntoView()}else scrollTo(0,0)}
const go=nav;
const openAuth=m=>{S.auth=m;openModal(authHTML())};
/* ---------- events ---------- */
document.addEventListener('click',e=>{if(e.target.id=='modal')return closeModal();const nv=e.target.closest('[data-nav]');if(nv){e.preventDefault();$('.top').classList.remove('open');return nav(nv.dataset.nav)}const t=e.target.closest('[data-act]');if(!t){if(e.target.closest('.links a'))$('.top').classList.remove('open');return}const a=t.dataset.act,id=t.dataset.id;
if(a=='menu')$('.top').classList.toggle('open');
else if(a=='auth')openAuth(t.dataset.m);else if(a=='close')closeModal();
else if(a=='logout'){store.del('hg_session');S.user=S.data=null;toast('You have been logged out.');go('home')}
else if(a=='start')S.user?go('dash'):openAuth('signup');else if(a=='viewdash')S.user?go('dash'):openAuth('login');
else if(a=='demo')demo();
else if(a=='tog'){const k=t.dataset.k;if(k>tk)return;const l=S.data.log[k]||[],i=l.indexOf(id);i<0?l.push(id):l.splice(i,1);S.data.log[k]=l;save();render()}
else if(a=='yr'){S.year+=+t.dataset.d;render()}else if(a=='mo'){S.month=+t.dataset.m;render()}
else if(a=='add'){S.edit=null;openModal(habitForm())}
else if(a=='ed'){S.edit=id;openModal(habitForm(S.data.habits.find(h=>h.id==id)))}
else if(a=='en'){const h=S.data.habits.find(h=>h.id==id);h.on=!h.on;save();render()}
else if(a=='rm'){const h=S.data.habits.find(h=>h.id==id);openModal(`<h2>Delete habit?</h2><p style="line-height:1.6">"${esc(h.name)}" and its history will be removed. This cannot be undone.</p><div class="acts"><button class="btn out" data-act="close">Cancel</button><button class="btn" style="background:var(--bad)" data-act="rmok" data-id="${id}">Delete habit</button></div>`)}
else if(a=='rmok'){S.data.habits=S.data.habits.filter(h=>h.id!=id);for(const k in S.data.log)S.data.log[k]=S.data.log[k].filter(x=>x!=id);save();closeModal();render();toast('Habit deleted.')}
else if(a=='wm'){S.wm=t.dataset.k;render()}
else if(a=='sample'){S.data=seed();save();render();toast('Sample data loaded.')}});
document.addEventListener('input',e=>{const b=e.target.dataset.bind;if(!b)return;if(b=='wdate'&&!e.target.value)return;S[b]=e.target.value;render()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
async function demo(){const u=store.get('hg_users',{}),em='demo@habitgame.app';if(!u[em]){u[em]={name:'Demo User',h:await hash(em,'demo1234')};store.set('hg_users',u)}loadUser(em,u[em].name)}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,t=f.dataset.form,v=Object.fromEntries(new FormData(f)),er=f.querySelector('.err'),fail=m=>{er.textContent=m;return false},btn=f.querySelector('.btn');
if(t=='habit'){const nm=(v.name||'').trim();if(nm.length<2)return fail('Enter a habit name with at least 2 characters.');if(S.data.habits.some(h=>h.name.toLowerCase()==nm.toLowerCase()&&h.id!=v.id))return fail('You already have a habit with that name.');
const o={name:nm,cat:v.cat,freq:+v.freq,time:v.time||'',on:!!v.on};if(v.id)Object.assign(S.data.habits.find(h=>h.id==v.id),o);else S.data.habits.push({id:'h'+Date.now().toString(36),...o});save();closeModal();render();toast(v.id?'Habit updated.':'Habit added.')}
else if(t=='well'){const n=x=>v[x]===''?NaN:+v[x];if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||v.date>tk)return fail('Pick a date that is today or earlier.');if(!(n('sleep')>=0&&n('sleep')<=24))return fail('Sleep must be between 0 and 24 hours.');if(!(n('water')>=0&&n('water')<=30))return fail('Water must be between 0 and 30 glasses.');if(!(n('ex')>=0&&n('ex')<=600))return fail('Exercise must be between 0 and 600 minutes.');
S.data.well[v.date]={mood:+v.mood,sleep:+v.sleep,energy:+v.energy,water:Math.round(+v.water),ex:Math.round(+v.ex)};save();render();toast('Wellness saved.')}
else{const em=(v.email||'').trim().toLowerCase(),u=store.get('hg_users',{});if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return fail('Enter a valid email address.');if(!v.pw||v.pw.length<6)return fail('Password must be at least 6 characters.');
if(t!='login'&&v.pw!==v.pw2)return fail('Passwords do not match.');btn.disabled=true;btn.textContent='Please wait...';const h=await hash(em,v.pw);
try{if(t=='signup'){if((v.name||'').trim().length<2)throw'Enter your name.';if(u[em])throw'An account with this email already exists. Try logging in.';u[em]={name:v.name.trim(),h};store.set('hg_users',u);loadUser(em,u[em].name);toast('Account created with sample data to explore.')}
else if(t=='login'){if(!u[em]||u[em].h!==h)throw'Incorrect email or password.';loadUser(em,u[em].name)}
else{if(!u[em])throw'No account found for that email on this device.';u[em].h=h;store.set('hg_users',u);S.auth='login';openModal(authHTML());toast('Password updated. Log in with your new password.')}}
catch(x){btn.disabled=false;btn.textContent='Try again';fail(String(x))}}});
(function init(){try{const em=store.get('hg_session',null),u=store.get('hg_users',{});if(em&&u[em]){S.user={email:em,name:u[em].name};S.data=store.get('hg_data_'+em,null);if(!S.data||!Array.isArray(S.data.habits)){S.data=seed();save()}}}catch(x){toast('Could not restore your session.','err')}nav(S.user?'dash':'home')})();
</script></body></html>
